<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة ألغاز الذكاء</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F172A;
      --card-bg: #1E293B;
      --accent: #F59E0B;
      --primary: #6366F1;
      --success: #10B981;
      --danger: #EF4444;
      --text: #F8FAFC;
    }

    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-sound {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      font-size: 1.2rem;
      padding: 6px 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.05);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .stats b { color: var(--accent); }

    .timer-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 1s linear;
    }

    .riddle {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 20px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option {
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.1);
      color: white;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    .option:hover:not(:disabled) { border-color: var(--accent); }
    .option.correct { background: var(--success) !important; border-color: var(--success) !important; }
    .option.wrong { background: var(--danger) !important; border-color: var(--danger) !important; }

    .helpers {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-helper {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #9CA3AF;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-main {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 14px 30px;
      font-size: 1.2rem;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
    }

    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="card" id="gameCard">
    <!-- شاشة البداية (Start Screen) -->
    <div id="startScreen">
      <div style="font-size: 4rem; margin-bottom: 10px;">🧩</div>
      <h1 style="color: var(--accent); margin-bottom: 10px;">ألغاز الذكاء الخارقة</h1>
      <p style="color: #9CA3AF; margin-bottom: 20px;">تحدَّ نفسك في مستويات بلا نهاية! اجمع العملات، وافتح الجوائز والمكافآت!</p>
      <button class="btn-main" onclick="startGame()">▶️ ابدأ اللعبة (Start Game)</button>
    </div>

    <!-- واجهة اللعب -->
    <div id="playArea" style="display: none;">
      <div class="top-bar">
        <button class="btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
        <button class="btn-helper" style="color: #EF4444; flex: none; padding: 6px 12px;" onclick="restartGame()">🔄 إعادة (Restart)</button>
      </div>

      <div class="stats">
        <div>⭐ المرحلة: <b id="levelNum">1</b></div>
        <div>🪙 العملات: <b id="coinsNum">0</b></div>
        <div>⏳ الوقت: <b id="timeLeft">15</b>s</div>
      </div>

      <div class="timer-bar-bg">
        <div class="timer-bar" id="timerBar"></div>
      </div>

      <div class="riddle" id="riddleText">جاري تحميل اللغز...</div>
      <div id="optionsBox"></div>

      <div class="helpers">
        <button class="btn-helper" id="btn5050" onclick="use5050()">💡 حذف إجابتين (30🪙)</button>
        <button class="btn-helper" id="btnSkip" onclick="useSkip()">⏭️ تخطي (50🪙)</button>
      </div>
    </div>

    <!-- شباك الجوائز عند كل 5 مستويات -->
    <div id="rewardModal" class="modal" style="display: none;">
      <div style="font-size: 4.5rem; margin-bottom: 10px;">🎁</div>
      <h2 style="color: var(--accent); margin-bottom: 10px;">جائزة المستوى!</h2>
      <p id="rewardMsg" style="margin-bottom: 20px;">أكملت 5 مستويات وحصلت على +50 عملة 🪙!</p>
      <button class="btn-main" onclick="closeReward()">متابعة اللعب 🚀</button>
    </div>

    <!-- شباك الخسارة -->
    <div id="gameOverModal" class="modal" style="display: none;">
      <div style="font-size: 4.5rem; margin-bottom: 10px;">💥</div>
      <h2 style="color: var(--danger); margin-bottom: 10px;">انتهى التحدي!</h2>
      <p style="margin-bottom: 5px;">وصلت إلى المستوى: <b id="finalLevel" style="color: var(--accent);">1</b></p>
      <p style="margin-bottom: 20px;">رصيدك النهائي: <b id="finalCoins" style="color: var(--accent);">0</b> 🪙</p>
      <button class="btn-main" onclick="restartGame()">🔄 العب من جديد (Restart)</button>
    </div>
  </div>

  <script>
    const questions = [
      { q: "ما هو الشيء الذي كلما أخذت منه كِبَر؟", opts: ["الحفرة", "البحر", "العمر", "الجبل"], a: 0 },
      { q: "شيء يملك أسناناً كثيرة ولكنه لا يعض؟", opts: ["المشط", "المنشار", "القرش", "المفتاح"], a: 0 },
      { q: "يمر عبر المدن والقرى لكنه لا يتحرك؟", opts: ["الطريق", "القطار", "الهواء", "النهر"], a: 0 },
      { q: "شيء مليء بالثقوب ولكنه يحتفظ بالماء؟", opts: ["الإسفنج", "الشبكة", "الغربال", "الدلو"], a: 0 },
      { q: "ما هو الشيء الذي يمكنك كسرُه دون أن تلمسَه؟", opts: ["الوعد", "الزجاج", "الخشب", "الصحن"], a: 0 },
      { q: "ما هو الشيء الذي يحضر ولا يُرى، ويتكلم بلا لسان؟", opts: ["الصدى", "الهواء", "العقل", "الحلم"], a: 0 },
      { q: "ما هو البيت الذي ليس فيه أبواب ولا نوافذ؟", opts: ["بيت الشعر", "بيت الدجاج", "بيت العنكبوت", "المقبرة"], a: 0 },
      { q: "شيء إذا أطعمته كَبُر، وإذا سقيته ماءً مات؟", opts: ["النار", "الشجرة", "الأسد", "الطفل"], a: 0 },
      { q: "ما هو الشجرة التي ليس لها ظل ولا أوراق ولا ثمار؟", opts: ["شجرة العائلة", "شجرة الزيتون", "شجرة النخيل", "الموز"], a: 0 },
      { q: "ما هو الشيء الذي يرتفع ولا ينزل أبدًا؟", opts: ["العمر", "الدخان", "الطائرة", "السعر"], a: 0 }
    ];

    let level = 1, coins = 0, timer, timeLeft = 15, isMuted = false, currentQ = null;

    // توليد أصوات اللعبة عبر المتصفح دون الحاجة لملفات خارجية
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function soundCorrect() { playBeep(600, 'sine', 0.12); setTimeout(() => playBeep(850, 'sine', 0.2), 120); }
    function soundWrong() { playBeep(220, 'sawtooth', 0.3); }
    function soundReward() { playBeep(523, 'triangle', 0.15); setTimeout(() => playBeep(659, 'triangle', 0.15), 150); setTimeout(() => playBeep(783, 'triangle', 0.3), 300); }

    function toggleSound() {
      isMuted = !isMuted;
      document.getElementById('soundBtn').innerText = isMuted ? '🔇' : '🔊';
    }

    function startGame() {
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("playArea").style.display = "block";
      document.getElementById("gameOverModal").style.display = "none";
      level = 1; coins = 0;
      updateStats();
      loadQuestion();
    }

    function updateStats() {
      document.getElementById("levelNum").innerText = level;
      document.getElementById("coinsNum").innerText = coins;
    }

    function loadQuestion() {
      clearInterval(timer);
      timeLeft = 15;
      updateTimerUI();

      // خلط الأسئلة والأجوبة تلقائياً لمستويات لا تنتهي
      let rawQ = questions[(level - 1) % questions.length];
      let opts = rawQ.opts.map((text, idx) => ({ text, isCorrect: idx === rawQ.a }));
      opts.sort(() => Math.random() - 0.5);

      currentQ = { q: rawQ.q, opts };

      document.getElementById("riddleText").innerText = currentQ.q;
      const box = document.getElementById("optionsBox");
      box.innerHTML = "";

      currentQ.opts.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = item.text;
        btn.onclick = () => check(item.isCorrect, btn);
        box.appendChild(btn);
      });

      timer = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timer);
          soundWrong();
          gameOver();
        }
      }, 1000);
    }

    function updateTimerUI() {
      document.getElementById("timeLeft").innerText = timeLeft;
      const bar = document.getElementById("timerBar");
      bar.style.width = `${(timeLeft / 15) * 100}%`;
      bar.style.backgroundColor = timeLeft <= 5 ? "var(--danger)" : "var(--accent)";
    }

    function check(isCorrect, btn) {
      clearInterval(timer);
      const allBtns = document.querySelectorAll(".option");
      allBtns.forEach(b => b.disabled = true);

      if (isCorrect) {
        btn.classList.add("correct");
        soundCorrect();
        coins += 10;
        setTimeout(() => {
          level++;
          updateStats();
          if ((level - 1) % 5 === 0) {
            coins += 50;
            updateStats();
            soundReward();
            document.getElementById("rewardMsg").innerText = `وصلت إلى المستوى ${level - 1} وفزت بمكافأة +50 عملة 🪙!`;
            document.getElementById("rewardModal").style.display = "flex";
          } else {
            loadQuestion();
          }
        }, 1000);
      } else {
        btn.classList.add("wrong");
        soundWrong();
        setTimeout(gameOver, 1200);
      }
    }

    function closeReward() {
      document.getElementById("rewardModal").style.display = "none";
      loadQuestion();
    }

    function use5050() {
      if (coins < 30) return alert("تحتاج 30 عملة 🪙 لاستخدام المساعدة!");
      coins -= 30;
      updateStats();
      let removed = 0;
      document.querySelectorAll(".option").forEach((btn, idx) => {
        if (!currentQ.opts[idx].isCorrect && removed < 2) {
          btn.style.visibility = "hidden";
          removed++;
        }
      });
    }

    function useSkip() {
      if (coins < 50) return alert("تحتاج 50 عملة 🪙 لتخطي المرحلة!");
      coins -= 50;
      level++;
      updateStats();
      loadQuestion();
    }

    function gameOver() {
      document.getElementById("finalLevel").innerText = level;
      document.getElementById("finalCoins").innerText = coins;
      document.getElementById("gameOverModal").style.display = "flex";
    }

    function restartGame() {
      startGame();
    }
  </script>
</body>
          </html>
